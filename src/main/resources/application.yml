spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: GYG_Backend
  profiles:
    default: prod
  datasource:
    hikari:
      connection-init-sql: SET search_path TO public, seguridad
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "${APP_TRUSTED_PROXIES:(?!)}"
      remote-ip-header: ${APP_REMOTE_IP_HEADER:X-Forwarded-For}
app:
  http:
    max-body-size: ${APP_MAX_REQUEST_BODY_SIZE:1MB}
  captcha:
    enabled: ${APP_CAPTCHA_ENABLED:true}
    provider: ${APP_CAPTCHA_PROVIDER:turnstile}
    secret: ${APP_CAPTCHA_SECRET:}
    expected-hostnames: ${APP_CAPTCHA_EXPECTED_HOSTNAMES:}
    ticket-ttl-seconds: ${APP_CAPTCHA_TICKET_TTL_SECONDS:120}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    dev-origins: ${APP_CORS_DEV_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  supabase:
    url: ${SUPABASE_URL:}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
  auth:
    admin-emails: ${APP_ADMIN_EMAILS:}
  tracking-code:
    pepper: ${APP_TRACKING_CODE_PEPPER:}
    legacy-enabled: ${APP_TRACKING_CODE_LEGACY_ENABLED:true}
  swagger:
    public: ${APP_SWAGGER_PUBLIC:false}
  rate-limit:
    contacto-per-hour: ${APP_RATE_LIMIT_CONTACTO_PER_HOUR:5}
    newsletter-per-hour: ${APP_RATE_LIMIT_NEWSLETTER_PER_HOUR:5}
    chat-per-minute: ${APP_RATE_LIMIT_CHAT_PER_MINUTE:20}
    seguimiento-per-minute: ${APP_RATE_LIMIT_SEGUIMIENTO_PER_MINUTE:10}
    seguimiento-attempts-per-15-min: ${APP_RATE_LIMIT_SEGUIMIENTO_ATTEMPTS_PER_15_MIN:20}
    seguimiento-failed-per-15-min: ${APP_RATE_LIMIT_SEGUIMIENTO_FAILED_PER_15_MIN:5}
    password-reset-per-hour: ${APP_RATE_LIMIT_PASSWORD_RESET_PER_HOUR:5}
  mail:
    from: ${APP_MAIL_FROM:}
    test-connection: ${APP_MAIL_TEST_CONNECTION:false}
  chat:
    gemini:
      enabled: ${APP_CHAT_GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${APP_CHAT_GEMINI_MODEL:gemini-3.6-flash}
  privacy:
    policy-version: ${APP_PRIVACY_POLICY_VERSION:1.1}
    chat-retention-months: ${APP_CHAT_LOG_RETENTION_MONTHS:12}
    chat-retention-cron: ${APP_CHAT_LOG_RETENTION_CRON:0 0 3 * * *}

# El detalle de mensajes HTTP puede contener PIN, respuestas y evidencias SST.
logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestPartMethodArgumentResolver: INFO
    org.springframework.jdbc.core.StatementCreatorUtils: INFO
