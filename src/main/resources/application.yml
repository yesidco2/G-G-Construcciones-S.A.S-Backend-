spring:
  application:
    name: GYG_Backend
  profiles:
    default: prod
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: "${APP_TRUSTED_PROXIES:(?!)}"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:25MB}
app:
  captcha:
    enabled: ${APP_CAPTCHA_ENABLED:true}
    provider: ${APP_CAPTCHA_PROVIDER:turnstile}
    secret: ${APP_CAPTCHA_SECRET:}
    ticket-ttl-seconds: ${APP_CAPTCHA_TICKET_TTL_SECONDS:120}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    dev-origins: ${APP_CORS_DEV_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  auth:
    admin-emails: ${APP_ADMIN_EMAILS:}
  tracking-code:
    pepper: ${APP_TRACKING_CODE_PEPPER:}
  swagger:
    public: ${APP_SWAGGER_PUBLIC:false}
  rate-limit:
    contacto-per-hour: ${APP_RATE_LIMIT_CONTACTO_PER_HOUR:5}
    chat-per-minute: ${APP_RATE_LIMIT_CHAT_PER_MINUTE:20}
    seguimiento-per-minute: ${APP_RATE_LIMIT_SEGUIMIENTO_PER_MINUTE:10}
