spring.application.name=demo-test

# H2 In-Memory Database for testing
spring.datasource.url=jdbc:h2:mem:gygtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true

app.cors.allowed-origins=http://localhost:5173
app.firebase.enabled=false
app.auth.admin-emails=seed-admin@example.com
app.swagger.public=false
app.rate-limit.contacto-per-hour=100
app.rate-limit.chat-per-minute=1000
app.rate-limit.seguimiento-per-minute=1000
